spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:healthcareservice}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:5jcJydmeKYqfVGD71KvWf+E0+Xz1eMdR7wDN+cHSRfEN4fqeN3F6Rcm2XzJj067zu9WLrb+TvUbkXzwDu87DnA==}
  token:
    validity: ${JWT_VALIDITY:3600000}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://localhost,https://healthcare-services-frontend.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

logging:
  level:
    com.project.HealthcareService: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
