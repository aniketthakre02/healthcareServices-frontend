services:
  db:
    image: mysql:8.0
    container_name: healthcare-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-healthcareservice}
      MYSQL_USER: ${DB_USER:-healthcare_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-healthcare_pass}
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - healthcare-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-healthcareservice}
      DB_USER: ${DB_USER:-healthcare_user}
      DB_PASSWORD: ${DB_PASSWORD:-healthcare_pass}
      DB_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-5jcJydmeKYqfVGD71KvWf+E0+Xz1eMdR7wDN+cHSRfEN4fqeN3F6Rcm2XzJj067zu9WLrb+TvUbkXzwDu87DnA==}
      JWT_VALIDITY: ${JWT_VALIDITY:-3600000}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:4173,http://localhost,https://healthcare-services-frontend.vercel.app}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      LOG_LEVEL: INFO
    ports:
      - "${BACKEND_PORT_HOST:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - healthcare-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: healthcare-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_HOST:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - healthcare-network

volumes:
  db_data:
    driver: local

networks:
  healthcare-network:
    driver: bridge
